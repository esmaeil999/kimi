name: JForex Tick Export

on:
  workflow_dispatch:
    inputs:
      instrument:
        description: "Instrument (e.g. EURUSD, GBPUSD, XAUUSD)"
        required: true
        default: "EURUSD"
      from:
        description: "Start time GMT (yyyy-MM-dd HH:mm:ss)"
        required: true
        default: "2019-01-01 00:00:00"
      to:
        description: "End time GMT (yyyy-MM-dd HH:mm:ss)"
        required: true
        default: "2019-02-01 00:00:00"
      chunk_hours:
        description: "Hours downloaded per history request"
        required: true
        default: "6"

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 350 # هر جاب در GitHub حداکثر ~۶ ساعت
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"

      - name: Download JForex API
        run: bash scripts/download-deps.sh

      - name: Build
        run: bash scripts/build.sh

      - name: Run tick export
        env:
          JFOREX_USERNAME: ${{ secrets.JFOREX_USERNAME }}
          JFOREX_PASSWORD: ${{ secrets.JFOREX_PASSWORD }}
          JFOREX_INSTRUMENT: ${{ inputs.instrument }}
          JFOREX_FROM: ${{ inputs.from }}
          JFOREX_TO: ${{ inputs.to }}
          JFOREX_CHUNK_HOURS: ${{ inputs.chunk_hours }}
        run: |
          SAFE_NAME=$(echo "${{ inputs.instrument }}" | tr -d '/_')
          export JFOREX_OUT_FILE="output/${SAFE_NAME}_ticks.csv"
          echo "Output file: $JFOREX_OUT_FILE"
          bash scripts/run.sh

      - name: Upload CSV artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ticks-${{ github.run_number }}
          path: output/*.csv
          if-no-files-found: warn
          retention-days: 30
