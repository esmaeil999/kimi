name: JForex Tick Export

on:
  workflow_dispatch:
    inputs:
      instrument:
        description: 'Instrument (e.g. EURUSD)'
        required: true
        default: 'EURUSD'
      from:
        description: 'Start (GMT), yyyy-MM-dd HH:mm:ss'
        required: true
        default: '2019-01-01 00:00:00'
      to:
        description: 'End (GMT), yyyy-MM-dd HH:mm:ss'
        required: true
        default: '2019-02-01 00:00:00'

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      - name: Compile and resolve runtime classpath
        run: |
          mvn -B compile
          mvn -B dependency:build-classpath -Dmdep.outputFile=target/cp.txt

      - name: Run tick export
        env:
          JFOREX_USERNAME: ${{ secrets.JFOREX_USERNAME }}
          JFOREX_PASSWORD: ${{ secrets.JFOREX_PASSWORD }}
          INSTRUMENT: ${{ inputs.instrument }}
          FROM_STR: ${{ inputs.from }}
          TO_STR: ${{ inputs.to }}
          OUT_FILE: output/ticks.csv
        run: |
          mkdir -p output
          java -cp "target/classes:$(cat target/cp.txt)" StrategyRunner

      - name: Upload CSV artifact
        uses: actions/upload-artifact@v4
        with:
          name: tick-csv
          path: output/*.csv
