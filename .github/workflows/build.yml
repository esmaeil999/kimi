name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      # Maven downloads JForex-API + DDS2-jClient-JForex from the official
      # Dukascopy public repo declared in pom.xml — no more manual jar download.
      - name: Compile with Maven
        run: mvn -B compile
